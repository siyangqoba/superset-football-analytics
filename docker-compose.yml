# docker compose up --build
#   analytics-db  Postgres with the football schema (host port 5433)
#   etl           generates the season and loads it, then exits
#   superset      Superset 4.1 on http://localhost:8088 (admin / admin)
#   bootstrap     creates the database connection, datasets, charts and dashboard, then exits
x-analytics-url: &analytics_url postgresql://analytics:analytics@analytics-db:5432/football

services:
  analytics-db:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: football
    ports: ["5433:5432"]
    volumes: [analytics-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d football"]
      interval: 5s
      retries: 20

  etl:
    build: .
    environment:
      ANALYTICS_DATABASE_URL: *analytics_url
      SEED: "42"
    depends_on:
      analytics-db: { condition: service_healthy }

  superset:
    build: ./superset
    command: ["/app/start.sh"]
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-secret-change-me}
      SUPERSET_METADATA_DB_URI: sqlite:////app/superset_home/superset.db
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    ports: ["8088:8088"]
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/start.sh:/app/start.sh:ro
      - superset-home:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 30
      start_period: 30s

  bootstrap:
    build: .
    command: ["python", "superset/bootstrap_dashboard.py"]
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ANALYTICS_DATABASE_URL: *analytics_url
    depends_on:
      superset: { condition: service_healthy }
      etl: { condition: service_completed_successfully }

volumes:
  analytics-data:
  superset-home:
